      function formatBytes(bytes) {
        const n = Number(bytes);
        if (!Number.isFinite(n) || n <= 0) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
        const value = n / Math.pow(1024, i);
        const decimals = i === 0 ? 0 : value >= 100 ? 0 : value >= 10 ? 1 : 2;
        return `${value.toFixed(decimals)} ${units[i]}`;
      }

      function computeWordCounterStats(text) {
        const normalized = String(text ?? "");

        const charCountWithSpaces = normalized.length;
        const charCountWithoutSpaces = normalized.replace(/\s/g, "").length;

        // Words: split on whitespace, ignore extra spaces.
        const trimmed = normalized.trim();
        const words = trimmed ? trimmed.split(/\s+/).filter(Boolean).length : 0;

        // Sentences: count groups of sentence-ending punctuation.
        // Example: "Hello..." counts as 1 sentence end.
        const sentenceMatches = normalized.match(/[.!?]+(?=\s|$)/g);
        const sentences = sentenceMatches ? sentenceMatches.length : 0;

        const readingTimeMinutes = words === 0 ? 0 : Math.ceil(words / 200);

      function getRandomInt(maxExclusive) {
        const max = Number(maxExclusive);
        if (!Number.isFinite(max) || max <= 0) return 0;

        // Prefer cryptographic randomness when available.
        if (typeof crypto !== "undefined" && crypto.getRandomValues) {
          const buf = new Uint32Array(1);
          // Rejection sampling to avoid modulo bias.
          const limit = Math.floor(0xffffffff / max) * max;
          let x = 0;
          do {
            crypto.getRandomValues(buf);
            x = buf[0];
          } while (x >= limit);
          return x % max;
        }

        return Math.floor(Math.random() * max);
      }

      function shuffleInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = getRandomInt(i + 1);
          const tmp = arr[i];
          arr[i] = arr[j];
          arr[j] = tmp;
        }
        return arr;
      }

      function strengthLabel(length, varietyCount) {
        // Simple heuristic: length + number of enabled sets.
        if (length >= 16 && varietyCount >= 3) return "Strong";
        if (length >= 10 && varietyCount >= 2) return "Medium";
        return "Weak";
      }

      function PasswordGenerator() {
        const [length, setLength] = useState(16);

        const [useLower, setUseLower] = useState(true);
        const [useNumbers, setUseNumbers] = useState(true);
        const [useSymbols, setUseSymbols] = useState(false);

        const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        const NUMS = "0123456789";
        const SYMS = "!@#$%^&*";

        const enabledSets = useMemo(() => {
          const sets = [];
          if (useUpper) sets.push({ name: "Uppercase", chars: UPPER });
          if (useLower) sets.push({ name: "Lowercase", chars: LOWER });
          if (useNumbers) sets.push({ name: "Numbers", chars: NUMS });
          if (useSymbols) sets.push({ name: "Symbols", chars: SYMS });
          return sets;
        }, [useUpper, useLower, useNumbers, useSymbols]);

        const canGenerate = enabledSets.length > 0;
        const varietyCount = enabledSets.length;
        const strength = strengthLabel(length, varietyCount);

        function generate() {
          if (!canGenerate) return;

          const allChars = enabledSets.map((s) => s.chars).join("");
          if (!allChars) return;

          const n = Math.max(4, Math.min(32, Number(length) || 16));
          const out = [];

          // Ensure at least one character from each selected set when possible.
          if (n >= enabledSets.length) {
            for (const s of enabledSets) {
              out.push(s.chars[getRandomInt(s.chars.length)]);
            }
          }

          while (out.length < n) {
            out.push(allChars[getRandomInt(allChars.length)]);
          }

          shuffleInPlace(out);
          setPassword(out.join(""));
          setCopyState("idle");
        }

      function extractYouTubeVideoId(input) {
        const raw = String(input ?? "").trim();
        if (!raw) return null;

        // Accept direct IDs (11 chars) as a convenience.
        if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) return raw;

        let url;
        try {
          url = new URL(raw);
        } catch {
          // Try adding protocol if user pasted without it.
          try {
            url = new URL(`https://${raw}`);
          } catch {
            return null;
          }
        }

        const host = url.hostname.replace(/^www\./, "").toLowerCase();
        const path = url.pathname || "";

        let id = null;

        if (host === "youtu.be") {
          // https://youtu.be/VIDEOID
          const seg = path.split("/").filter(Boolean)[0];
          id = seg || null;
        } else if (host.endsWith("youtube.com")) {
          // https://www.youtube.com/watch?v=VIDEOID
          if (path === "/watch") {
            id = url.searchParams.get("v");
          }
          // https://www.youtube.com/embed/VIDEOID
          if (!id && path.startsWith("/embed/")) {
            id = path.split("/").filter(Boolean)[1] || null;
          }
          // https://www.youtube.com/shorts/VIDEOID
          if (!id && path.startsWith("/shorts/")) {
            id = path.split("/").filter(Boolean)[1] || null;
          }
        }

        if (!id) return null;
        if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return null;
        return id;
      }

        const [originalUrl, setOriginalUrl] = useState("");

          return () => URL.revokeObjectURL(url);
        }, [compressedBlob]);

        useEffect(() => {
          if (!file) {
            setCompressedBlob(null);
            setError("");
            setBusy(false);
            return;
          }

          const jobId = ++jobIdRef.current;
          setBusy(true);
          setError("");

          const run = async () => {
            try {
              const dataUrl = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("Failed to read file."));
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
              });

              const img = await new Promise((resolve, reject) => {

                image.src = String(dataUrl);
              });

              const canvas = document.createElement("canvas");
              canvas.width = img.naturalWidth || img.width;
              canvas.height = img.naturalHeight || img.height;

              const ctx = canvas.getContext("2d");
              if (!ctx) throw new Error("Canvas is not supported in this browser.");
              ctx.drawImage(img, 0, 0);

              const inputType = String(file.type || "").toLowerCase();
              const outputType =
                inputType === "image/png" ? "image/png" : inputType === "image/webp" ? "image/webp" : "image/jpeg";

              const q = Math.max(0.1, Math.min(1, Number(quality) || 0.8));
              const blob = await new Promise((resolve) => {
                canvas.toBlob(
                  (b) => resolve(b),
                  outputType,
                  q
                );
              });

              if (jobId !== jobIdRef.current) return;

              if (!blob) {
                setCompressedBlob(null);
                setError("Compression failed. Please try a different image.");

              setCompressedBlob(null);
              setError(msg);
            } finally {
              if (jobId === jobIdRef.current) setBusy(false);
            }

      function toTitleCase(text) {
        const s = String(text ?? "");
        // Capitalize first letter of each word, preserve spacing/punctuation.
        return s.replace(/\b([A-Za-z])([A-Za-z]*)\b/g, (_, first, rest) => {
          return String(first).toUpperCase() + String(rest).toLowerCase();
        });
      }

      function toCamelCase(text) {
        const s = String(text ?? "");
        const parts = s.trim().split(/[^A-Za-z0-9]+/).filter(Boolean);
        if (parts.length === 0) return "";
        const first = parts[0].toLowerCase();
        const rest = parts.slice(1).map((p) => {
          const lower = p.toLowerCase();
          return lower.charAt(0).toUpperCase() + lower.slice(1);
        });
        return [first, ...rest].join("");
      }

            setCopyState("error");

      function clamp01(x) {
        const n = Number(x);
        if (!Number.isFinite(n)) return 0;
        return Math.min(1, Math.max(0, n));
      }

      function hexToRgb(hex) {
        const raw = String(hex ?? "").trim();
        const m = raw.match(/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
        if (!m) return null;
        let h = m[1];
        if (h.length === 3) {
          h = h
            .split("")
            .map((c) => c + c)
            .join("");
        }
        const r = parseInt(h.slice(0, 2), 16);
        const g = parseInt(h.slice(2, 4), 16);
        const b = parseInt(h.slice(4, 6), 16);
        if ([r, g, b].some((v) => Number.isNaN(v))) return null;
        return { r, g, b };
      }

      function rgbToHsl({ r, g, b }) {
        const rr = clamp01(r / 255);
        const gg = clamp01(g / 255);
        const bb = clamp01(b / 255);

        const max = Math.max(rr, gg, bb);
        const min = Math.min(rr, gg, bb);
        const delta = max - min;

        let h = 0;
        let s = 0;
        const l = (max + min) / 2;

        if (delta !== 0) {
          s = delta / (1 - Math.abs(2 * l - 1));
          switch (max) {
            case rr:
              h = ((gg - bb) / delta) % 6;
              break;
            case gg:
              h = (bb - rr) / delta + 2;
              break;
            default:
              h = (rr - gg) / delta + 4;
              break;
          }
          h = Math.round(h * 60);
          if (h < 0) h += 360;
        }

        return {
          h,
          s: Math.round(s * 100),
          l: Math.round(l * 100),
        };
      }

      function daysInMonthUTC(year, monthIndex) {
        return new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
      }

      function toUtcDateFromParts(parts) {
        return new Date(Date.UTC(parts.y, parts.m, parts.d));
      }

      function addYearsToParts(parts, yearsToAdd) {
        const y = parts.y + yearsToAdd;
        const m = parts.m;
        const maxDay = daysInMonthUTC(y, m);
        const d = Math.min(parts.d, maxDay);
        return { y, m, d };
      }

      function addMonthsToParts(parts, monthsToAdd) {
        const total = parts.m + monthsToAdd;
        const y = parts.y + Math.floor(total / 12);
        const m = ((total % 12) + 12) % 12;
        const maxDay = daysInMonthUTC(y, m);
        const d = Math.min(parts.d, maxDay);
        return { y, m, d };
      }

      function parseDateInputToParts(value) {
        const s = String(value ?? "").trim();
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return null;
        const y = Number(m[1]);
        const mo = Number(m[2]);
        const d = Number(m[3]);
        if (!Number.isFinite(y) || !Number.isFinite(mo) || !Number.isFinite(d)) return null;
        if (mo < 1 || mo > 12) return null;
        const monthIndex = mo - 1;
        const maxDay = daysInMonthUTC(y, monthIndex);
        if (d < 1 || d > maxDay) return null;
        return { y, m: monthIndex, d };
      }

      function calculateAgeParts(dobParts, todayParts) {
        const dobDate = toUtcDateFromParts(dobParts);
        const todayDate = toUtcDateFromParts(todayParts);
        if (dobDate.getTime() > todayDate.getTime()) {
          return { error: "Date of birth cannot be in the future." };
        }

        let years = todayParts.y - dobParts.y;
        let anchor = addYearsToParts(dobParts, years);
        if (toUtcDateFromParts(anchor).getTime() > todayDate.getTime()) {
          years -= 1;
          anchor = addYearsToParts(dobParts, years);
        }

        // Months remaining after years.
        let months = (todayParts.y - anchor.y) * 12 + (todayParts.m - anchor.m);
        let anchorMonth = addMonthsToParts(anchor, months);
        if (toUtcDateFromParts(anchorMonth).getTime() > todayDate.getTime()) {
          months -= 1;
          anchorMonth = addMonthsToParts(anchor, months);
        }

        // Days remaining after years + months.
        const msPerDay = 24 * 60 * 60 * 1000;
        const days = Math.round((todayDate.getTime() - toUtcDateFromParts(anchorMonth).getTime()) / msPerDay);

        return { years, months, days, error: "" };
      }

      function formatUsd(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "$0.00";
        try {
          return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD",
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }).format(n);
        } catch {
          const fixed = n.toFixed(2);
          return `$${fixed}`;
        }
      }

            `}</style>

            <ToolCard>
                <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
                  <div>
                    <h1 className="text-3xl sm:text-4xl font-semibold tracking-tight text-slate-900">Invoice Generator</h1>
                    <p className="text-slate-600 mt-2">
                      Create invoices quickly with this free online invoice generator. Print or save as PDF in one click.
                    </p>
                    <p className="text-slate-600 mt-2">Create a simple invoice and print or save as PDF.</p>
                  </div>

                  <div className="no-print flex items-center gap-2 flex-wrap">
                    <button
                      type="button"
                      onClick={generateInvoice}
                      className={UI.btnPrimary}
                    >
                      Generate Invoice
                    </button>
                    <button
                      type="button"
                      onClick={printInvoice}
                      disabled={!generated}
                      className={cx(
                        UI.btnSecondary,
                        !generated ? "opacity-60 cursor-not-allowed" : ""
                      )}
                    >
                      Print / Download PDF
                    </button>
                  </div>
                </div>

                <div className="mt-5 no-print">
                  <AdPlaceholder />
                </div>

                <div className="mt-6 grid grid-cols-1 lg:grid-cols-2 gap-4">
                  {/* Inputs */}
                  <div className={cx(UI.subCard, "no-print")}> 
                    <div className="text-sm font-semibold text-slate-800">Details</div>

                    <div className="mt-4 space-y-3">
                      <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-2" htmlFor="clipdrop-invoice-your">
                          Your Name / Business Name
                        </label>
                        <input
                          id="clipdrop-invoice-your"
                          type="text"
                          value={yourName}
                          onChange={(e) => setYourName(e.target.value)}
                          className={UI.input}
                          placeholder="Your Business"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-2" htmlFor="clipdrop-invoice-client">
                          Client Name
                        </label>
                        <input
                          id="clipdrop-invoice-client"
                          type="text"
                          value={clientName}
                          onChange={(e) => setClientName(e.target.value)}
                          className={UI.input}
                          placeholder="Client Company"
                        />
                      </div>
                    </div>

                    <div className="mt-6">
                      <div className="flex items-center justify-between gap-3">
                        <div className="text-sm font-semibold text-slate-800">Items</div>
                        <button
                          type="button"
                          onClick={addItem}
                          className={cx(UI.btnSecondary, "px-3 py-2")}
                        >
                          Add Item
                        </button>
                      </div>

                      <div className="mt-3 overflow-auto rounded-xl border border-slate-200 bg-white">
                        <table className="w-full text-sm">
                          <thead className="bg-slate-50">
                            <tr className="text-left text-slate-600">
                              <th className="px-4 py-3 font-medium">Item Name</th>
                              <th className="px-4 py-3 font-medium w-40">Price</th>
                            </tr>
                          </thead>
                          <tbody>
                            {items.map((it, idx) => (
                              <tr key={idx} className="border-t border-slate-200">
                                <td className="px-4 py-3">
                                  <input
                                    type="text"
                                    value={it.name}
                                    onChange={(e) => updateItem(idx, { name: e.target.value })}
                                    className={cx(
                                      "w-full rounded-lg bg-white border border-slate-300",
                                      "px-3 py-2 text-slate-900 placeholder:text-slate-400",
                                      "focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition"
                                    )}
                                    placeholder={`Item ${idx + 1}`}
                                  />
                                </td>
                                <td className="px-4 py-3">
                                  <input
                                    type="number"
                                    inputMode="decimal"
                                    min="0"
                                    step="0.01"
                                    value={it.price}
                                    onChange={(e) => updateItem(idx, { price: e.target.value })}
                                    className={cx(
                                      "w-full rounded-lg bg-white border border-slate-300",
                                      "px-3 py-2 text-slate-900 placeholder:text-slate-400",
                                      "focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition"
                                    )}
                                    placeholder="0.00"
                                  />
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                      <div className="mt-3 flex items-center justify-between text-sm">
                        <div className="text-slate-400">Total</div>
                        <div className="font-semibold text-slate-900 tabular-nums">{formatUsd(total)}</div>
                      </div>
                    </div>
                  </div>

                  {/* Preview */}
                  <div className={UI.subCard}>
                    <div className="text-sm font-semibold text-slate-800 mb-3">Invoice preview</div>

                    {!generated ? (
                      <div className="rounded-xl border border-slate-200 bg-white p-4 text-sm text-slate-500">
                        Click “Generate Invoice” to preview.
                      </div>
                    ) : (
                      <div id="clipdrop-invoice-print" className="rounded-2xl bg-white text-slate-900 border border-slate-200 p-6">
                        <div className="flex items-start justify-between gap-6">
                          <div>
                            <div className="text-xl font-semibold">Invoice</div>
                            <div className="text-sm text-slate-600 mt-1">Date: {invoiceDate}</div>
                          </div>
                          <div className="text-right">
                            <div className="text-sm text-slate-600">Total</div>
                            <div className="text-2xl font-semibold">{formatUsd(total)}</div>
                          </div>
                        </div>

                        <div className="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-6">
                          <div>
                            <div className="text-xs uppercase tracking-wide text-slate-500">From</div>
                            <div className="mt-1 font-medium">{yourName || "—"}</div>
                          </div>
                          <div>
                            <div className="text-xs uppercase tracking-wide text-slate-500">Bill To</div>
                            <div className="mt-1 font-medium">{clientName || "—"}</div>
                          </div>
                        </div>

                        <div className="mt-6 overflow-auto">
                          <table className="w-full text-sm">
                            <thead>
                              <tr className="text-left text-slate-600 border-b border-slate-200">
                                <th className="py-2 pr-3 font-medium">Item</th>
                                <th className="py-2 pl-3 font-medium text-right">Price</th>
                              </tr>
                            </thead>
                            <tbody>
                              {items.map((it, idx) => {
                                const priceNum = Number(it.price);
                                const safePrice = Number.isFinite(priceNum) ? priceNum : 0;
                                return (
                                  <tr key={idx} className="border-b border-slate-100">
                                    <td className="py-2 pr-3">{it.name || `Item ${idx + 1}`}</td>
                                    <td className="py-2 pl-3 text-right tabular-nums">{formatUsd(safePrice)}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>

                        <div className="mt-6 flex items-center justify-end">
                          <div className="w-full sm:w-72">
                            <div className="flex items-center justify-between text-sm text-slate-700">
                              <div>Subtotal</div>
                              <div className="tabular-nums">{formatUsd(total)}</div>
                            </div>
                            <div className="mt-2 flex items-center justify-between text-base font-semibold">
                              <div>Total</div>
                              <div className="tabular-nums">{formatUsd(total)}</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
            </ToolCard>
          </Page>
        );
      }

      function ToolPage({ title }) {
        return (
          <Page>
            <ToolCard>
              <h1 className="text-3xl sm:text-4xl font-semibold tracking-tight text-slate-900">{title}</h1>
              <p className="text-slate-600 mt-2">Free online {title} tool by ClipDrop Tools. Fast, simple, and no signup required.</p>
              <div className="mt-5">
                <AdPlaceholder />
              </div>
            </ToolCard>
          </Page>
        );
      }

      function Footer() {
        return (
          <footer className="border-t border-slate-200 bg-white shadow-sm">
            <Container className="px-4 sm:px-6">
              <div className="py-8 text-center text-sm text-slate-600 font-medium">
                © 2026 ClipDrop Tools — Fast, Free Online Tools That Actually Work
              </div>
            </Container>
          </footer>
        );
      }

      function normalizePathname(pathname) {
        const raw = String(pathname || "/");
        if (raw === "") return "/";
        // Remove trailing slashes except for root.
        return raw.length > 1 ? raw.replace(/\/+$/, "") : raw;
      }

      function pageKeyToPath(pageKey) {
        switch (pageKey) {
          case PAGES.HOME:
            return "/";
          case PAGES.WORD_COUNTER:
            return "/word-counter";
          case PAGES.IMAGE_COMPRESSOR:
            return "/image-compressor";
          case PAGES.IMAGE_CONVERTER:
            return "/image-converter";
          case PAGES.PASSWORD_GENERATOR:
            return "/password-generator";
          case PAGES.AGE_CALCULATOR:
            return "/age-calculator";
          case PAGES.SALARY_CALCULATOR:
            return "/salary-calculator";
          case PAGES.YT_THUMBNAIL:
            return "/youtube-thumbnail-downloader";
          case PAGES.JSON_FORMATTER:
            return "/json-formatter";
          case PAGES.TEXT_CASE:
            return "/text-case-converter";
          case PAGES.COLOR_PICKER:
            return "/color-picker";
          case PAGES.RANDOM_NAME:
            return "/random-name-generator";
          case PAGES.INVOICE_GENERATOR:
            return "/invoice-generator";
          default:
            return "/";
        }
      }

      function App() {
        const [mobileOpen, setMobileOpen] = useState(false);

        useEffect(() => {
          window.addEventListener("popstate", () => {
            window.location.reload();
          });
        }, []);

        function navigateTo(pageKey) {
          const to = pageKeyToPath(pageKey);
          window.history.pushState({}, "", to);
          window.location.reload();
        }

        const path = normalizePathname(window.location.pathname);

        let page = PAGES.HOME;
        let content = <Home onSelectTool={navigateTo} />;

        if (path === "/") {
          page = PAGES.HOME;
          content = <Home onSelectTool={navigateTo} />;
        } else if (path === "/word-counter") {
          page = PAGES.WORD_COUNTER;
          content = <WordCounter />;
        } else if (path === "/image-compressor") {
          page = PAGES.IMAGE_COMPRESSOR;
          content = <ImageCompressor />;
        } else if (path === "/image-converter") {
          page = PAGES.IMAGE_CONVERTER;
          content = <ImageConverter />;
        } else if (path === "/password-generator") {
          page = PAGES.PASSWORD_GENERATOR;
          content = <PasswordGenerator />;
        } else if (path === "/age-calculator") {
          page = PAGES.AGE_CALCULATOR;
          content = <AgeCalculator />;
        } else if (path === "/salary-calculator") {
          page = PAGES.SALARY_CALCULATOR;
          content = <SalaryToHourlyCalculator />;
        } else if (path === "/youtube-thumbnail-downloader") {
          page = PAGES.YT_THUMBNAIL;
          content = <YouTubeThumbnailDownloader />;
        } else if (path === "/json-formatter") {
          page = PAGES.JSON_FORMATTER;
          content = <JsonFormatterValidator />;
        } else if (path === "/text-case-converter") {
          page = PAGES.TEXT_CASE;
          content = <TextCaseConverter />;
        } else if (path === "/color-picker") {
          page = PAGES.COLOR_PICKER;
          content = <ColorPickerHexConverter />;
        } else if (path === "/random-name-generator") {
          page = PAGES.RANDOM_NAME;
          content = <RandomNameGenerator />;
        } else if (path === "/invoice-generator") {
          page = PAGES.INVOICE_GENERATOR;
          content = <InvoiceGenerator />;
        } else {
          // Unknown route: fallback to Home.
          page = PAGES.HOME;
          content = <Home onSelectTool={navigateTo} />;
        }

        const pageTitle = page;

        return (
          <div className="min-h-screen flex bg-slate-50 text-slate-900">
            <Sidebar
              currentPage={page}
              onNavigate={navigateTo}
              mobileOpen={mobileOpen}
              setMobileOpen={setMobileOpen}
            />

            <div className="flex-1 flex flex-col min-w-0">
              <TopBar
                onOpenMobileSidebar={() => setMobileOpen(true)}
                pageTitle={pageTitle}
              />

              <main className="flex-1 bg-gradient-to-b from-slate-50 to-white">
                {content}
              </main>

              <Footer />
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
