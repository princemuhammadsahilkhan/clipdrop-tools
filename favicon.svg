<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="ClipDrop favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- Gear ring for a tool-like feel -->
  <g transform="translate(46 18)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="white" stroke-width="2" opacity="0.95" />
    <g fill="white" opacity="0.95">
      <rect x="-1" y="-12" width="2" height="3" rx="1" />
      <rect x="-1" y="9" width="2" height="3" rx="1" />
      <rect x="9" y="-1" width="3" height="2" rx="1" />
      <rect x="-12" y="-1" width="3" height="2" rx="1" />
      <rect x="6.9" y="-8.1" width="2" height="3" rx="1" transform="rotate(45 7.9 -6.6)" />
      <rect x="-8.9" y="5.1" width="2" height="3" rx="1" transform="rotate(45 -7.9 6.6)" />
      <rect x="5.1" y="6.9" width="3" height="2" rx="1" transform="rotate(45 6.6 7.9)" />
      <rect x="-8.1" y="-8.9" width="3" height="2" rx="1" transform="rotate(45 -6.6 -7.9)" />
    </g>
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.95" />
  </g>

  <text x="19" y="45" fill="white" font-size="34" font-weight="800" font-family="Arial, Helvetica, sans-serif">C</text>
</svg>
